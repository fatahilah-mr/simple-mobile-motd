# ==============================================================================
# motd-fatah - Configuration File
# Location: /etc/motd-fatah/motd.conf (or alongside motd.sh)
# ==============================================================================

# --- Visual & Layout ---
# Banner Style: "mini" (default, best for mobile), "block", "slant", or "none"
BANNER_STYLE="mini"

# Custom Banner Text (Max 5-8 chars recommended for mobile portrait)
BANNER_TEXT="FATAH"

# Color Theme: "cyan", "green", "purple", "blue", "yellow", "rainbow", "mono"
THEME="cyan"

# Progress Bar Width:
# "auto" : 10 chars on narrow screens (< 60 cols), 15 chars on wider screens
# Or specify a fixed number (e.g. 10, 15, 20)
BAR_WIDTH="auto"

# Progress Bar Symbols
BAR_FILLED="█"
BAR_EMPTY="░"

# --- Module Toggles (true/false) ---
SHOW_HEADER=true
SHOW_CPU_INFO=true
SHOW_SYSTEM_INFO=true
SHOW_NETWORK=true
SHOW_RESOURCES=true
SHOW_SWAP=true
SHOW_SERVICES=true
SHOW_UPDATES=true

# --- Network Settings ---
# Fetch Public IP (Timeout in seconds; set to 0 to disable WAN check)
PUBLIC_IP_TIMEOUT=1

# Show VPN interface (e.g. tailscale0, wg0, tun0) if available
SHOW_VPN=true

# --- Services to Monitor (comma-separated systemd service names) ---
# Example: "ssh,docker,tailscaled,nginx,caddy,wireguard"
MONITOR_SERVICES="ssh,docker,tailscaled"
